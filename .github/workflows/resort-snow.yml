name: Refresh Brian Head and Snowbowl snow reports
on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/refresh_resort_snow.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resort-snow.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh resort snow reports"
            git push
          fi
