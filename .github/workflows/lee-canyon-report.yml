name: Refresh Lee Canyon mountain report
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/refresh_lee_canyon.py
      - name: Commit report if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lee-canyon-snow.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Lee Canyon mountain report"
            git push
          fi
